version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot updates the pin and
  # its version comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
